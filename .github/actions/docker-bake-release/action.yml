name: Docker Bake Release

description: Setup Docker build environment and run fixed release bake targets for a selected CPU architecture.

inputs:
  dockerhub_username:
    description: Docker Hub username.
    required: true
  dockerhub_token:
    description: Docker Hub access token.
    required: true
  platform:
    description: Target architecture for bake execution (amd64 or arm64).
    required: true

runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: Validate platform input
      shell: bash
      run: |
        case "${{ inputs.platform }}" in
          amd64|arm64)
            ;;
          *)
            echo "Unsupported platform: '${{ inputs.platform }}'. Allowed values: amd64, arm64." >&2
            exit 1
            ;;
        esac

    - name: Resolve platform configuration
      id: resolve_platform
      shell: bash
      run: |
        case "${{ inputs.platform }}" in
          amd64)
            echo "docker_platform=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "compose_env_files=.env,.env.amd64" >> "$GITHUB_OUTPUT"
            ;;
          arm64)
            echo "docker_platform=linux/arm64" >> "$GITHUB_OUTPUT"
            echo "compose_env_files=.env,.env.arm64" >> "$GITHUB_OUTPUT"
            ;;
        esac

    - name: Render compose config
      shell: bash
      run: |
        export COMPOSE_ENV_FILES="${{ steps.resolve_platform.outputs.compose_env_files }}"
        export COMPOSE_PROFILES="base,base2,jre,maven,sonar,galleon"
        rendered_file="docker-compose.rendered.${{ inputs.platform }}.yml"
        docker compose -f docker-compose.yml config > "$rendered_file"

    - name: docker buildx bake "#1"
      uses: docker/bake-action@v5
      with:
        set: |
          *.platform=${{ steps.resolve_platform.outputs.docker_platform }}
        push: true
        files: |
          docker-compose.rendered.${{ inputs.platform }}.yml
        targets: base-release,base-alpine-release,dind-runner-release

    - name: docker buildx bake "#2"
      uses: docker/bake-action@v5
      with:
        set: |
          *.platform=${{ steps.resolve_platform.outputs.docker_platform }}
        push: true
        files: |
          docker-compose.rendered.${{ inputs.platform }}.yml
        targets: curl-release,alpine-runner-release,deployment-release

    - name: docker buildx bake "#3"
      uses: docker/bake-action@v5
      with:
        set: |
          *.platform=${{ steps.resolve_platform.outputs.docker_platform }}
        push: true
        files: |
          docker-compose.rendered.${{ inputs.platform }}.yml
        targets: nexus-download-builder,java11jre-release,java17jre-release,java21jre-release,java25jre-release

    - name: docker buildx bake "#4"
      uses: docker/bake-action@v5
      with:
        set: |
          *.platform=${{ steps.resolve_platform.outputs.docker_platform }}
        push: true
        files: |
          docker-compose.rendered.${{ inputs.platform }}.yml
        targets: java11-maven-builder,java17-maven-builder,java21-maven-builder,java25-maven-builder

    - name: docker buildx bake "#5"
      uses: docker/bake-action@v5
      with:
        set: |
          *.platform=${{ steps.resolve_platform.outputs.docker_platform }}
        push: true
        files: |
          docker-compose.rendered.${{ inputs.platform }}.yml
        targets: java17-maven-sonar-builder

    - name: docker buildx bake "#6"
      uses: docker/bake-action@v5
      with:
        set: |
          *.platform=${{ steps.resolve_platform.outputs.docker_platform }}
        push: true
        files: |
          docker-compose.rendered.${{ inputs.platform }}.yml
        targets: java11-galleon-builder,java17-galleon-builder,java21-galleon-builder,java25-galleon-builder

    - name: Cleanup rendered compose config
      if: ${{ always() }}
      shell: bash
      run: rm -f "docker-compose.rendered.${{ inputs.platform }}.yml"

